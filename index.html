<!doctype html>
<html lang="en" class="theme-loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wishlist</title>
<meta name="description" content="A wishlist shop, filterable by shop, type and price, with a little gift-picking helper.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css?v=20261015e">
<script>
  /* If config.js has a typo, the browser skips the whole file. Note where, so the site can
     still find the sheet link and ?check can point at the line. */
  window.addEventListener('error', function (e) {
    if (/config\.js/.test(e.filename || '')) window.WISHLIST_CONFIG_ERROR = { line: e.lineno, message: e.message };
  }, true);
</script>
<script>
  /* config.js is the file people edit, so always fetch it fresh: changes show up as soon as
     GitHub publishes them, not after a cache expires. */
  document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');
</script>
<script>
  /* Load the theme's stylesheet before the page draws, so it never flashes unstyled.
     Order: ?theme=name (a preview), then the theme picked in the sheet's Settings tab last
     time this browser visited, then config.js. app.js reads the Settings tab and swaps the
     theme if it has changed. */
  (function () {
    /* In the theme lab (theme-lab.html), the lab page supplies the theme instead of a folder. */
    if (/[?&]lab(?:[=&]|$)/.test(location.search) && window.parent !== window) {
      document.write('<style id="theme-css"></style>');
      setTimeout(function () { document.documentElement.classList.remove('theme-loading'); }, 4000);
      return;
    }
    var cfg = window.WISHLIST_CONFIG || {};
    var asked = (location.search.match(/[?&]theme=([\w-]+)/) || [])[1];
    var remembered = null;
    try { remembered = localStorage.getItem('wishlist-sheet-theme'); } catch (e) { /* private mode */ }
    var clean = function (v) { return String(v || '').toLowerCase().replace(/[^a-z0-9-]/g, ''); };
    var theme = clean(asked) || clean(remembered) || clean(cfg.theme) || 'rpg-shop';
    window.WISHLIST_THEME = theme;
    window.WISHLIST_THEME_PREVIEW = Boolean(clean(asked));
    document.write('<link rel="stylesheet" id="theme-css" href="themes/' + theme + '/theme.css?v=20261015e">');
    setTimeout(function () { document.documentElement.classList.remove('theme-loading'); }, 4000);
  })();
</script>
<script src="app.js?v=20261019a" defer></script>
</head>
<body>

<header class="hero">
  <div class="hero-sky" data-art="heroSky" aria-hidden="true"></div>

  <div class="wrap hero-inner">
    <div class="hero-top">
      <div class="event-tag" data-hide-if-empty="eventTag">
        <svg aria-hidden="true" width="10" height="12" viewBox="0 0 10 12"><path d="M0 0 L10 6 L0 12 Z" style="fill:var(--star)"/></svg>
        <span data-t="eventTag"></span>
      </div>
      <div class="stats">
        <span class="stat">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linejoin="round" style="stroke:var(--text)"><path d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z"/><path d="M12 7 L17.5 16 H6.5 Z"/><path d="M12 2 V7 M3 7 L6.5 16 M21 7 L17.5 16 M12 22 L6.5 16 M12 22 L17.5 16"/></svg>
          <span id="stat-items" data-t="loading"></span>
        </span>
        <span class="stat stat-gold">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" style="fill:var(--text)"/></svg>
          <span id="stat-starred">…</span>
        </span>
        <span class="stat" id="stat-shops">…</span>
      </div>
      <span id="mode-badge" class="mode-badge" hidden></span>
    </div>
    <h1 data-t="title"></h1>

    <div class="dialog">
      <div class="dialog-name" data-t="welcomeName" data-hide-if-empty="welcomeName"></div>
      <div class="dialog-portrait" data-art="portrait" aria-hidden="true"></div>
      <p data-t="welcome"></p>
      <svg aria-hidden="true" class="dialog-caret" width="14" height="10" viewBox="0 0 14 10"><path d="M0 0 H14 L7 10 Z" style="fill:var(--text)"/></svg>
    </div>
  </div>

  <div class="hero-scene" data-art="heroScene" aria-hidden="true"></div>
</header>

<section class="wrap planner-wrap" aria-labelledby="gp-title">
  <div class="panel planner">
    <div class="planner-left">
      <div class="planner-head">
        <h2 id="gp-title" class="pixel planner-title" data-t="plannerTitle"></h2>
        <div class="quest-tag" data-hide-if-empty="plannerTag">
          <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linejoin="round" style="stroke:var(--text)"><path d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z"/><path d="M12 7 L17.5 16 H6.5 Z"/></svg>
          <span data-t="plannerTag"></span>
        </div>
      </div>

      <div class="mascot-row">
        <div class="mascot-col">
          <div id="mascot" class="mascot" data-mood="idle" role="img">
            <span class="m-idle" data-art="mascotIdle"></span>
            <span class="m-happy" data-art="mascotHappy"></span>
            <span class="m-sad" data-art="mascotSad"></span>
          </div>
          <div class="mascot-name" data-t="mascotLabel" data-hide-if-empty="mascotLabel"></div>
        </div>
        <div class="bubble">
          <svg aria-hidden="true" class="bubble-tail" width="16" height="18" viewBox="0 0 16 18"><path d="M16 0 L0 12 L16 15" stroke-width="3" stroke-linejoin="round"/><rect x="14" y="2" width="5" height="12"/></svg>
          <p id="mascot-line" aria-live="polite" data-t="planner.loading"></p>
        </div>
      </div>

      <div class="planner-fields">
        <div class="field">
          <label for="gp-budget" class="pixel field-label" data-t="budgetLabel"></label>
          <div class="money-input">
            <span aria-hidden="true">$</span>
            <input id="gp-budget" type="number" inputmode="decimal" min="0" step="any" placeholder="100">
          </div>
        </div>
        <div class="field">
          <label for="gp-count" class="pixel field-label"><span data-t="countLabel"></span> <span class="optional" data-t="optional"></span></label>
          <input id="gp-count" class="text-input" type="number" inputmode="numeric" min="1" step="1" data-t-placeholder="countPlaceholder">
        </div>
      </div>
    </div>

    <div class="planner-right" id="gp-result" aria-live="polite"></div>
  </div>
</section>

<main class="wrap shop">
  <aside class="panel filters" data-t-aria="filtersLabel">
    <div class="field">
      <label for="q" class="pixel filter-title" data-t="searchLabel"></label>
      <input id="q" class="text-input" type="search" data-t-placeholder="searchPlaceholder" autocomplete="off">
    </div>

    <label class="star-toggle">
      <input id="star-only" type="checkbox">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" style="fill:var(--text)"/></svg>
      <span data-t="starredOnly"></span>
    </label>

    <label class="vendor gift-toggle" id="gift-toggle" hidden>
      <input id="hide-gift" type="checkbox">
      <span class="vendor-name" data-t="hideGiftCards"></span>
    </label>

    <div class="filter-group">
      <div id="type-label" class="pixel filter-title" data-t="typeFilter"></div>
      <div id="type-chips" class="chip-row" role="group" aria-labelledby="type-label"></div>
    </div>

    <fieldset class="filter-group">
      <legend class="pixel filter-title" data-t="shopFilter"></legend>
      <div id="vendor-list"></div>
    </fieldset>

    <div class="filter-group">
      <div id="price-label" class="pixel filter-title price-title">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2.4" style="fill:var(--star);stroke:var(--text)"/><path d="M12 7 V17" stroke-width="2.4" stroke-linecap="round" style="stroke:var(--text)"/></svg>
        <span data-t="priceFilter"></span>
      </div>
      <div id="price-chips" class="chip-row" role="group" aria-labelledby="price-label"></div>
    </div>

    <button type="button" id="reset" class="btn btn-mint" data-t="reset"></button>
  </aside>

  <section class="results" data-t-aria="resultsLabel">
    <div class="results-bar">
      <div id="count" class="count" aria-live="polite"></div>
      <label class="sort">
        <span data-t="sortLabel"></span>
        <select id="sort">
          <option value="wanted" data-t="sortStarred"></option>
          <option value="low" data-t="sortLow"></option>
          <option value="high" data-t="sortHigh"></option>
          <option value="name" data-t="sortName"></option>
        </select>
      </label>
    </div>

    <div id="status" class="status" hidden></div>
    <div id="grid" class="grid"></div>
  </section>
</main>

<footer class="pixel footer" data-t="footer"></footer>

<dialog id="loot-dialog" class="loot-dialog" aria-labelledby="loot-title">
  <form id="loot-form" method="dialog">
    <div class="loot-head">
      <svg aria-hidden="true" width="40" height="40" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M2 5h12v9H2z" style="fill:var(--star)"/><path d="M2 5h12v1H2zM2 13h12v1H2zM1 5h1v9H1zM14 5h1v9h-1zM2 8h12v1H2zM3 3h10v2H3zM2 4h1v1H2zM13 4h1v1h-1zM4 2h8v1H4z" style="fill:var(--text)"/><path d="M7 7h2v3H7z" style="fill:var(--text)"/></svg>
      <h2 id="loot-title" class="pixel" data-t="lootTitle"></h2>
    </div>
    <p class="loot-item" id="loot-name"></p>
    <p class="loot-copy" id="loot-copy"></p>
    <div class="loot-qty-row" id="loot-qty-row">
      <label for="loot-qty" data-t="lootQty"></label>
      <input id="loot-qty" class="text-input" type="number" inputmode="numeric" min="1" step="1" value="1">
      <span id="loot-left" class="loot-left"></span>
    </div>
    <p id="loot-error" class="loot-error" role="alert" data-t="lootError" hidden></p>
    <div class="loot-actions">
      <button type="button" id="loot-cancel" class="btn btn-plain" data-t="cancel"></button>
      <button type="submit" id="loot-confirm" class="btn btn-gold" data-t="lootConfirm"></button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

</body>
</html>
